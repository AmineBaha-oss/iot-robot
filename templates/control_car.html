{% extends "base.html" %} {% block title %}Control Car - IoT Smart Robot Car{%
endblock %} {% block content %}
<div class="container">
  <h1 class="page-title">Control Car</h1>

  <div class="control-section">
    <div class="card">
      <div class="card-header">
        <h2>Motor Control</h2>
      </div>
      <div class="card-body">
        <div class="motor-control">
          <div class="control-grid">
            <div></div>
            <button
              class="btn btn-control btn-up"
              onclick="controlMotor('forward')"
            >
              ⬆ Forward
            </button>
            <div></div>
            <button
              class="btn btn-control btn-left"
              onclick="controlMotor('left')"
            >
              ⬅ Left
            </button>
            <button
              class="btn btn-control btn-stop"
              onclick="controlMotor('stop')"
            >
              ⏹ Stop
            </button>
            <button
              class="btn btn-control btn-right"
              onclick="controlMotor('right')"
            >
              ➡ Right
            </button>
            <div></div>
            <button
              class="btn btn-control btn-down"
              onclick="controlMotor('backward')"
            >
              ⬇ Backward
            </button>
            <div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h2>Device Control</h2>
      </div>
      <div class="card-body">
        <div class="device-controls">
          <div class="device-item">
            <h3>💡 LEDs</h3>
            <button class="btn btn-success" onclick="controlLED('on')">
              ON
            </button>
            <button class="btn btn-danger" onclick="controlLED('off')">
              OFF
            </button>
          </div>
          <div class="device-item">
            <h3>🔔 Buzzer</h3>
            <button class="btn btn-success" onclick="controlBuzzer('on')">
              ON
            </button>
            <button class="btn btn-danger" onclick="controlBuzzer('off')">
              OFF
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="status-message" id="status-message"></div>
</div>
{% endblock %} {% block scripts %}
<script>
  function controlMotor(action) {
    fetch("/api/control/motor", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ action: action }),
    })
      .then((response) => response.json())
      .then((data) => {
        showStatus(
          data.success
            ? `Motor command sent: ${action}`
            : "Failed to send command",
          data.success
        );
      })
      .catch((error) => {
        console.error("Error:", error);
        showStatus("Error sending command", false);
      });
  }

  function controlLED(state) {
    fetch("/api/control/led", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ state: state }),
    })
      .then((response) => response.json())
      .then((data) => {
        showStatus(
          data.success ? `LED turned ${state}` : "Failed to control LED",
          data.success
        );
      })
      .catch((error) => {
        console.error("Error:", error);
        showStatus("Error controlling LED", false);
      });
  }

  function controlBuzzer(state) {
    fetch("/api/control/buzzer", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ state: state }),
    })
      .then((response) => response.json())
      .then((data) => {
        showStatus(
          data.success ? `Buzzer turned ${state}` : "Failed to control buzzer",
          data.success
        );
      })
      .catch((error) => {
        console.error("Error:", error);
        showStatus("Error controlling buzzer", false);
      });
  }

  function showStatus(message, success) {
    const statusDiv = document.getElementById("status-message");
    statusDiv.textContent = message;
    statusDiv.className = "status-message " + (success ? "success" : "error");
    setTimeout(() => {
      statusDiv.textContent = "";
      statusDiv.className = "status-message";
    }, 3000);
  }
</script>
{% endblock %}
